spring.application.name=MultiAceites
server.port=8081
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/multiaceites}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
springdoc.swagger-ui.path=/swagger-ui.html
app.jwt.secret=${JWT_SECRET:MultiAceitesClaveSuperSegura2026DebeTenerMasDe32Caracteres}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
